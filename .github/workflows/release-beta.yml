name: Release beta full package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miuread-beta-release
  cancel-in-progress: false

jobs:
  release-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Check out beta
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read beta identity
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "beta" ]; then
            echo "::error::请从 beta 分支运行此工作流，当前分支为 ${GITHUB_REF_NAME}"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          config = Path("miuread.koplugin/miuread/config.lua").read_text(encoding="utf-8")
          meta = Path("miuread.koplugin/_meta.lua").read_text(encoding="utf-8")
          pattern = r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?'
          cv = re.search(r'\bVERSION\s*=\s*["\'](' + pattern + r')["\']', config)
          mv = re.search(r'\bversion\s*=\s*["\'](' + pattern + r')["\']', meta)
          channel = re.search(r'\bUPDATE_CHANNEL\s*=\s*["\']([^"\']+)["\']', config)
          if not cv or not mv:
              print("::error::无法读取内测版本号")
              sys.exit(1)
          if cv.group(1) != mv.group(1):
              print(f"::error::版本号不一致：{cv.group(1)} / {mv.group(1)}")
              sys.exit(1)
          if not channel or channel.group(1) != "beta":
              print("::error::当前代码未固定到 beta 通道")
              sys.exit(1)
          version = cv.group(1)
          if "-beta." not in version:
              print(f"::error::内测版本号格式错误：{version}")
              sys.exit(1)
          Path("release.env").write_text(
              f"VERSION={version}\n"
              f"RELEASE_TAG=v{version}\n"
              f"PACKAGE_NAME=miuread-v{version}-full.zip\n",
              encoding="utf-8",
          )
          print(f"准备发布内测版：v{version}")
          PY
          cat release.env >> "$GITHUB_ENV"

      - name: Build beta full package and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, json, os, sys

          version = os.environ["VERSION"]
          package_name = os.environ["PACKAGE_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          root = Path("miuread.koplugin")
          output = Path("dist") / package_name
          fixed_time = (2020, 1, 1, 0, 0, 0)
          if not root.is_dir():
              print("::error::缺少 miuread.koplugin")
              sys.exit(1)

          excluded_names = {".DS_Store", "miuread.lua", "settings.reader.lua"}
          excluded_suffixes = {".md", ".epub", ".log"}
          def excluded(path):
              return "__MACOSX" in path.parts or path.name in excluded_names or path.suffix.lower() in excluded_suffixes

          with ZipFile(output, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              directories = [root] + sorted([p for p in root.rglob("*") if p.is_dir()], key=lambda p: p.as_posix())
              for path in directories:
                  info = ZipInfo(path.as_posix().rstrip("/") + "/", fixed_time)
                  info.create_system = 3
                  info.external_attr = (0o40755 << 16) | 0x10
                  archive.writestr(info, b"")
              for path in sorted([p for p in root.rglob("*") if p.is_file() and not excluded(p)], key=lambda p: p.as_posix()):
                  info = ZipInfo(path.as_posix(), fixed_time)
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.compress_type = ZIP_DEFLATED
                  archive.writestr(info, path.read_bytes(), compress_type=ZIP_DEFLATED, compresslevel=9)

          payload = output.read_bytes()
          official = f"https://github.com/{repo}/releases/download/v{version}/{package_name}"
          manifest = {
              "channel": "beta",
              "version": version,
              "name": f"觅阅 · 微信读书助手 {version} 内测版",
              "package_type": "full",
              "package_url": official,
              "package_urls": [
                  official,
                  f"https://ghfast.top/{official}",
                  f"https://gh-proxy.com/{official}",
                  f"https://ghproxy.net/{official}",
              ],
              "size": len(payload),
              "sha256": hashlib.sha256(payload).hexdigest(),
              "notes": "内测版：重做普通用户菜单，隐藏开发诊断与权限倒计时；合并可自定义手势；修复到期书未走验证、批注403反复续期、旧验证数据和Android后台下载恢复。",
          }
          Path("dist/update-beta.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"已生成：{output}")
          print(f"大小：{len(payload)}")
          print(f"SHA-256：{manifest['sha256']}")
          PY

      - name: Verify beta package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json, os, re, sys

          package = Path("dist") / os.environ["PACKAGE_NAME"]
          manifest = json.loads(Path("dist/update-beta.json").read_text(encoding="utf-8"))
          required = {
              "miuread.koplugin/_meta.lua",
              "miuread.koplugin/main.lua",
              "miuread.koplugin/miuread/config.lua",
          }
          forbidden_names = {".DS_Store", "miuread.lua", "settings.reader.lua"}
          forbidden_suffixes = {".md", ".epub", ".log"}
          with ZipFile(package) as archive:
              names = archive.namelist()
              bad = archive.testzip()
              config = archive.read("miuread.koplugin/miuread/config.lua").decode("utf-8")
          errors = []
          if bad: errors.append(f"ZIP 文件损坏：{bad}")
          errors.extend(f"缺少文件：{x}" for x in sorted(required.difference(names)))
          for name in names:
              path = Path(name)
              if not name.startswith("miuread.koplugin/"): errors.append(f"根目录错误：{name}")
              if path.name in forbidden_names or path.suffix.lower() in forbidden_suffixes or "__MACOSX" in path.parts:
                  errors.append(f"不应进入安装包：{name}")
          if 'UPDATE_CHANNEL = "beta"' not in config: errors.append("安装包未固定到 beta 通道")
          if manifest.get("channel") != "beta": errors.append("内测清单通道错误")
          if manifest.get("version") != os.environ["VERSION"]: errors.append("内测清单版本错误")
          if errors:
              for error in errors: print(f"::error::{error}")
              sys.exit(1)
          print(f"内测安装包检查通过，共 {len(names)} 个条目。")
          PY

      - name: Create or update prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="dist/$PACKAGE_NAME"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" "$FILE"
            gh release edit "$RELEASE_TAG" --prerelease --target beta --title "觅阅 · 微信读书助手 $VERSION 内测版"
          else
            gh release create "$RELEASE_TAG" "$FILE" \
              --target beta \
              --title "觅阅 · 微信读书助手 $VERSION 内测版" \
              --notes "内测全量包，仅供内测用户安装。" \
              --prerelease
          fi

      - name: Update beta manifest
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin beta
          cp dist/update-beta.json update-beta.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-beta.json
          if git diff --cached --quiet; then
            echo "update-beta.json 无变化。"
          else
            git commit -m "Update beta manifest to $RELEASE_TAG"
            git push origin beta
          fi
