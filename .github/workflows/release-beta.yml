name: Release beta full package

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miuread-beta-release
  cancel-in-progress: false

jobs:
  release-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Read beta identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          config = Path("miuread.koplugin/miuread/config.lua").read_text(encoding="utf-8")
          meta = Path("miuread.koplugin/_meta.lua").read_text(encoding="utf-8")
          pattern = r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?'
          cv = re.search(r'\bVERSION\s*=\s*["\'](' + pattern + r')["\']', config)
          mv = re.search(r'\bversion\s*=\s*["\'](' + pattern + r')["\']', meta)
          channel = re.search(r'\bUPDATE_CHANNEL\s*=\s*["\']([^"\']+)["\']', config)
          if not cv or not mv or cv.group(1) != mv.group(1):
              print("::error::无法读取一致的内测版本号")
              sys.exit(1)
          version = cv.group(1)
          if not channel or channel.group(1) != "beta" or "-beta." not in version:
              print(f"::error::内测通道或版本格式错误：{version}")
              sys.exit(1)
          changelog = Path(f"CHANGELOG-{version}.txt")
          if not changelog.is_file() or not changelog.read_text(encoding="utf-8").strip():
              print(f"::error::缺少当前版本更新说明：{changelog}")
              sys.exit(1)
          Path("release.env").write_text(
              f"VERSION={version}\nRELEASE_TAG=v{version}\nPACKAGE_NAME=miuread-v{version}-full.zip\n",
              encoding="utf-8",
          )
          PY
          cat release.env >> "$GITHUB_ENV"

      - name: Run Lua checks and regression tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          find miuread.koplugin -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          lua5.1 tests/test_chapter_title.lua "$PWD"
          lua5.1 tests/test_memory_mode.lua "$PWD"
          lua5.1 tests/test_download_result.lua "$PWD"
          lua5.1 tests/test_annotation_fallback.lua "$PWD"
          lua5.1 tests/test_thought_plain.lua "$PWD"
          lua5.1 tests/test_thought_popup_fallback.lua "$PWD"

      - name: Build beta full package and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, json, os, sys

          version = os.environ["VERSION"]
          package_name = os.environ["PACKAGE_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          root = Path("miuread.koplugin")
          output = Path("dist") / package_name
          fixed_time = (2020, 1, 1, 0, 0, 0)
          excluded_names = {".DS_Store", "miuread.lua", "settings.reader.lua"}
          excluded_suffixes = {".md", ".epub", ".log"}

          def excluded(path):
              return "__MACOSX" in path.parts or path.name in excluded_names or path.suffix.lower() in excluded_suffixes

          if not root.is_dir():
              print("::error::缺少 miuread.koplugin")
              sys.exit(1)

          with ZipFile(output, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              directories = [root] + sorted([p for p in root.rglob("*") if p.is_dir()], key=lambda p: p.as_posix())
              for path in directories:
                  info = ZipInfo(path.as_posix().rstrip("/") + "/", fixed_time)
                  info.create_system = 3
                  info.external_attr = (0o40755 << 16) | 0x10
                  archive.writestr(info, b"")
              for path in sorted([p for p in root.rglob("*") if p.is_file() and not excluded(p)], key=lambda p: p.as_posix()):
                  info = ZipInfo(path.as_posix(), fixed_time)
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.compress_type = ZIP_DEFLATED
                  archive.writestr(info, path.read_bytes(), compress_type=ZIP_DEFLATED, compresslevel=9)

          payload = output.read_bytes()
          official = f"https://github.com/{repo}/releases/download/v{version}/{package_name}"
          notes = Path(f"CHANGELOG-{version}.txt").read_text(encoding="utf-8").strip()
          manifest = {
              "channel": "beta",
              "version": version,
              "name": f"觅阅 · 微信读书助手 {version} 内测版",
              "package_type": "full",
              "package_url": official,
              "package_urls": [official, f"https://ghfast.top/{official}", f"https://gh-proxy.com/{official}", f"https://ghproxy.net/{official}"],
              "size": len(payload),
              "sha256": hashlib.sha256(payload).hexdigest(),
              "notes": notes,
          }
          Path("dist/update-beta.json").write_text(json.dumps(manifest, ensure_ascii=True, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Verify beta package and notes
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "dist/$PACKAGE_NAME"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json, os, sys

          package = Path("dist") / os.environ["PACKAGE_NAME"]
          manifest = json.loads(Path("dist/update-beta.json").read_text(encoding="utf-8"))
          notes = Path(f"CHANGELOG-{os.environ['VERSION']}.txt").read_text(encoding="utf-8").strip()
          with ZipFile(package) as archive:
              names = archive.namelist()
              bad = archive.testzip()
          errors = []
          if bad: errors.append(f"ZIP 文件损坏：{bad}")
          for required in ("miuread.koplugin/_meta.lua", "miuread.koplugin/main.lua", "miuread.koplugin/miuread/config.lua"):
              if required not in names: errors.append(f"缺少文件：{required}")
          if manifest.get("version") != os.environ["VERSION"]: errors.append("清单版本错误")
          if manifest.get("notes") != notes: errors.append("线上更新说明未使用当前 CHANGELOG")
          if "验证周期保持10分钟" in manifest.get("notes", ""): errors.append("仍包含废弃的旧更新说明")
          if errors:
              for error in errors: print(f"::error::{error}")
              sys.exit(1)
          PY

      - name: Create or update prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="dist/$PACKAGE_NAME"
          NOTES_FILE="CHANGELOG-$VERSION.txt"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" "$FILE"
            gh release edit "$RELEASE_TAG" --prerelease --target beta \
              --title "觅阅 · 微信读书助手 $VERSION 内测版" --notes-file "$NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" "$FILE" --target beta \
              --title "觅阅 · 微信读书助手 $VERSION 内测版" --notes-file "$NOTES_FILE" --prerelease
          fi

      - name: Update beta manifest
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin beta
          cp dist/update-beta.json update-beta.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-beta.json
          if git diff --cached --quiet; then
            echo "update-beta.json 无变化。"
          else
            git commit -m "Update beta manifest to $RELEASE_TAG"
            git push origin beta
          fi
