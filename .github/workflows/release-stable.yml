name: 发布正式版

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: miuread-release-stable
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布正式包
    runs-on: ubuntu-latest
    steps:
      - name: 读取源码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 检查分支与版本
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main" || {
            echo "此工作流只能在 main 分支运行，当前分支为 $GITHUB_REF_NAME"
            exit 1
          }
          test "$(cat CHANNEL)" = "stable" || {
            echo "CHANNEL 与工作流不一致"
            exit 1
          }
          python3 scripts/build_release.py --channel stable --check-only

      - name: 生成发布文件
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release.py --channel stable

      - name: 创建或更新 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          TAG="v${VERSION}"
          TITLE="觅阅 ${VERSION}"
          ASSETS=(dist/*.zip dist/*.json dist/SHA256SUMS.txt dist/RELEASE_NOTES-*.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md --prerelease=false --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" --target "$GITHUB_SHA" --title "$TITLE" --notes-file RELEASE_NOTES.md --latest
          fi

      - name: 写回更新清单
        shell: bash
        run: |
          set -euo pipefail
          cp "dist/update.json" "update.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "update.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore: update stable manifest for v$(cat VERSION)"
            git push origin "HEAD:main"
          fi
